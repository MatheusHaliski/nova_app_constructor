# NOVA App Constructor — ambiente de desenvolvimento.
#   docker compose up --build                       # MySQL (central) + backend + frontend
#   docker compose --profile conectores up --build   # + Redis, OpenSearch, MinIO e Cassandra (opcionais)
name: nova

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nova
      MYSQL_USER: nova
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nova_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unova", "-p${MYSQL_PASSWORD:-nova_dev}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nova?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
      SPRING_DATASOURCE_USERNAME: nova
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-nova_dev}
      NOVA_JWT_PRIVATE_KEY: ${NOVA_JWT_PRIVATE_KEY:-}
      NOVA_JWT_PUBLIC_KEY: ${NOVA_JWT_PUBLIC_KEY:-}
      NOVA_ADMIN_EMAIL: ${NOVA_ADMIN_EMAIL:-}
      NOVA_ADMIN_PASSWORD: ${NOVA_ADMIN_PASSWORD:-}
      NOVA_CORS_ALLOWED_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NOVA_REDIS_ENABLED: ${NOVA_REDIS_ENABLED:-false}
      NOVA_REDIS_URL: redis://redis:6379
      NOVA_OPENSEARCH_ENABLED: ${NOVA_OPENSEARCH_ENABLED:-false}
      NOVA_OPENSEARCH_URL: http://opensearch:9200
      NOVA_S3_ENABLED: ${NOVA_S3_ENABLED:-false}
      NOVA_S3_URL: http://minio:9000
      NOVA_CASSANDRA_ENABLED: ${NOVA_CASSANDRA_ENABLED:-false}
      NOVA_CASSANDRA_URL: cassandra:9042
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      NOVA_API_URL: http://backend:8080
    ports: ["3000:3000"]

  # ---- Conectores opcionais (MySQL continua sendo a fonte central) ----
  redis:
    image: redis:7.4-alpine
    profiles: [conectores]
    ports: ["6379:6379"]

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: [conectores]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [conectores]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nova}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nova_dev_minio}
    ports: ["9000:9000", "9001:9001"]

  cassandra:
    image: cassandra:5.0
    profiles: [conectores]
    ports: ["9042:9042"]

volumes:
  mysql-data:
